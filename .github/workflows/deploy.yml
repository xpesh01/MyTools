name: Deploy

# Сайт пересобирается и публикуется при каждом пуше в основную ветку.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Права, которые нужны actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: публикуем только последний коммит
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        # BASE_PATH — это /<имя-репозитория>/, именно по такому пути отдаёт файлы Pages
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
